<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174f32" />
    <title>Sem conexão · Ginkle</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ginkle-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #f4f8f4;
        --fg: #183d29;
        --muted: #526b5a;
        --card: #ffffff;
        --border: #dce8de;
        --primary: #174f32;
        --primary-fg: #ffffff;
      }
      .dark {
        --bg: #0f1f10;
        --fg: #e4f0e5;
        --muted: #8fab91;
        --card: #1e2b1f;
        --border: #2a532c;
        --primary: #7ab07f;
        --primary-fg: #0f1f10;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2rem 1.75rem;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        border-radius: 12px;
        background: #174f32;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      h1 {
        font-size: 1.35rem;
        line-height: 1.25;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      .acoes {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: 0;
        background: var(--primary);
        color: var(--primary-fg);
      }
      a {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="36"
          height="36"
          viewBox="690 690 620 620"
          style="fill-rule: evenodd; clip-rule: evenodd"
        >

              fill="#7ab07f"
            />
            <path
              d="M469.502,750.716C477.101,750.65 540.386,750.098 564.488,750.939C613.335,752.644 651.485,753.691 648.142,758.286C642.972,765.392 454.447,764.926 403.508,762.327C376.401,760.944 365.732,760.586 366.508,757.504C368.026,751.479 461.245,750.778 469.502,750.716Z"
              fill="#8fab91"
            />
          </g>
        </svg>
      </div>
      <p class="eyebrow">Ginkle · Modo offline</p>
      <h1>Você está sem conexão</h1>
      <p>
        Esta página precisa de internet para carregar dados atualizados. Assim
        que o sinal voltar, o aplicativo recarrega automaticamente e sincroniza
        eventuais registros pendentes.
      </p>
      <div class="acoes">
        <button type="button" onclick="window.location.reload()">
          Tentar novamente
        </button>
        <a href="/">Voltar para a página inicial</a>
      </div>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
